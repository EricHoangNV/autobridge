# REQ-024 B2 case library (data, not code).
#
# REQ-024 owner check on f32b4b4b: the case file may hold ONLY what every
# arm gets (scenario id, connector, pre-drift spec source, the vendor docs
# the task is described in, budgets via HarnessConfig) plus grading data
# the arms never see (``expected``). Drift labels (drift_class), detector
# output (delta), hypothesis-engine output (hypotheses,
# enumerator_yield_count), rule hints (extra) and the post-drift reference
# (validate_against) are FORBIDDEN here: ``bench/ablation.py`` refuses to
# load a case containing them, so pre-diagnosed inputs cannot sneak back.
# The engine arms derive everything from observation (served fault →
# execute_sync → detector → classifier → hypothesis engine → ladder).
#
# Vendor names (spec ids, docs paths) live HERE so bench stays generic
# machinery: the trust-boundary guard tests fail on hardcoded vendor
# names in engine source. ``bench/`` (the harness, outside
# ``src/autobridge``) may name vendors the way the tests do.
cases:
  offset_to_cursor:
    spec: {kind: generated_offset, base: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: repair
  rename_guest_id:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: repair
  cursor_repeat_token:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: repair
  page_to_cursor:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: repair
  rate_limit_429:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: no_patch
  transient_503:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: no_patch
  token_expired:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: no_patch
  gross_to_net:
    spec: {kind: generated, connector: harborpms}
    docs: simulators/docs/harborpms.md
    expected: degraded_question
  status_vocab_change:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: no_patch
  duplicate_late_records:
    spec: {kind: generated, connector: atlaspms}
    docs: simulators/docs/atlaspms-openapi.yaml
    expected: no_patch
  meridian_cursor_renamed:
    spec: {kind: docs, path: simulators/docs/meridian-openapi.yaml, connector: meridianpms, vocabulary: v2}
    docs: simulators/docs/meridian-openapi.yaml
    expected: repair
  meridian_state_renamed:
    spec: {kind: docs, path: simulators/docs/meridian-openapi.yaml, connector: meridianpms, vocabulary: v2}
    docs: simulators/docs/meridian-openapi.yaml
    expected: repair

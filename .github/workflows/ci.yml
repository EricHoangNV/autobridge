# AutoBridge CI — P1.W9.2 (plan §4 W9), demo chain P1.W10.3 (plan §4 W10).
#
# One job, ordered steps, from a clean clone:
#   unit (coverage gate) → smoke → e2e (pytest suite + Playwright UI journey)
#   → demo (six steps via the control API, live against the stack).
# The Compose stack is brought up once by `make up`, reused by `make e2e`
# (the harness detects the already-up stack and leaves teardown to us), and
# always torn down by `make down` — even when an earlier step fails.

name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: unit → smoke → e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"

    steps:
      - name: Checkout (clean clone)
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node 22 (UI + Playwright)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # ---- lint + types + trust-boundary contract (DIRECTIVES §2/§5) ----
      - name: Lint (ruff + import-linter) and typecheck
        run: |
          make lint
          make typecheck

      # ---- unit: coverage gate per package (plan §3) ----
      # UI deps first (one-time `npm ci`; no-op when ui/node_modules exists).
      # `make test` includes the Vitest UI component tests (DIRECTIVES §5).
      - name: Install UI dependencies
        run: make ui-deps

      - name: Unit tests (90% coverage gate per package + Vitest)
        run: make test

      # ---- AR-2-5: images build from hash-pinned lockfiles, bases pinned ----
      # Fail if the committed requirements locks drift from uv.lock, then
      # rebuild the verifier image twice and diff `pip freeze`: the acceptance
      # root must resolve byte-identical dependencies on every build.
      - name: Lockfiles in sync + verifier image reproducible
        run: |
          make lockfiles
          git diff --exit-code -- requirements.engine.lock verifier/requirements.lock simulators/requirements.lock
          ./scripts/check-image-repro.sh

      # ---- smoke: stack up + healthz/readyz + network checks ----
      - name: Bring up the Compose stack
        run: make up

      - name: Smoke (healthz/readyz + negative network checks)
        run: make smoke

      # ---- e2e: whole pytest suite, random order, against the stack ----
      - name: E2E pytest suite (random order)
        run: make e2e

      # ---- e2e-ui: Playwright journey (green with mocks if stack down) ----
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: E2E UI journey (Playwright)
        run: make e2e-ui

      # ---- demo: six steps via the control API (plan §6, P1.W10.3) ----
      # Runs after e2e so fault injection cannot contaminate the suite;
      # live against the stack (falls back to local evidence if unreachable).
      - name: Demo (six steps via control API)
        run: make demo

      - name: Tear down the Compose stack
        if: always()
        run: make down

[project]
name = "verifier"
version = "0.1.0"
description = "AutoBridge verifier — oracle and hidden fixtures"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifier"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["verifier"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

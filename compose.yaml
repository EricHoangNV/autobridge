# AutoBridge Compose stack (plan §2.1). P1.W1.2: every service as a stub app
# with GET /healthz + GET /readyz, on the four trust-zone networks.
#
# Networks (plan §2.1 + §5 S2 + REQ-022 B):
#   engine-net   control, worker, runtime-sandbox, edge-relay, ui (+ bench reaches control)
#   vendor-net   runtime-sandbox <-> simulator public API (8000) ONLY
#   verifier-net control <-> verifier ONLY
#   admin-net    control <-> simulator admin API (8001, W2.2) ONLY
#   edge-net     edge-worker <-> edge-relay (cloud command queue) +
#                edge-worker <-> sim-fias-pabx (REQ-022; FIAS TCP dial-out
#                to the host, public docs on 8000) + the
#                sim-fias-pabx-admin sidecar (REQ-034: a dumb :8001 pipe so
#                control reaches sim-fias-pabx:8001 for /demo/reset +
#                inject-fault; the :8000 data plane stays edge-net only and
#                unreachable from control). The agent is outbound-only: it
#                polls the relay and dials nothing else; the PABX dials the
#                agent.
#
# Negative checks enforced by attachment (asserted in `make smoke`):
#   runtime-sandbox has no route to verifier-net / admin-net
#   (sandbox -/-> verifier fixtures, sandbox -/-> simulator admin)
#   ui is on engine-net only (ui -/-> simulators, ui -/-> verifier)
#   worker is on engine-net only (no verifier / simulator-admin route)
#   control has no route to edge-net (control -/-> sim-fias-pabx:8000,
#   REQ-022; control reaches the agent only via the edge-relay queue on
#   engine-net; control reaches the FIAS *admin* :8001 through the
#   sim-fias-pabx-admin sidecar on admin-net — `make smoke` asserts
#   exactly that split: :8001 up, :8000 down)
#   edge-worker has no route to vendor-net / verifier-net / admin-net
#   (edge -/-> cloud sims, edge -/-> verifier, edge -/-> simulator admin)
#   edge-relay initiates no connections at all (dumb authenticated pipe)

x-healthcheck-py: &healthcheck-py
  test:
    [
      "CMD-SHELL",
      "python -c \"import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)\"",
    ]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

services:
  control:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.control.app:app
      # REQ-017/AUDIT-2026-10-29: inside a container there is no docker
      # binary/socket, so auto-detection would report "local" and readyz/UI
      # would claim no network isolation on the Compose stack. Pin it.
      AUTOBRIDGE_RUNTIME: "docker"
      AUTOBRIDGE_OPERATOR: ${AUTOBRIDGE_OPERATOR:-operator}
      AUTOBRIDGE_CONTROL_TOKEN: ${AUTOBRIDGE_CONTROL_TOKEN:-}
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
      # AR-2-4: HMAC key for edge release signatures. Control signs releases
      # with it; the edge worker verifies with it. Empty (local dev) means
      # unkeyed integrity checksums — set a random value before exposing the
      # stack beyond localhost.
      EDGE_RELEASE_SECRET: ${EDGE_RELEASE_SECRET:-}
      # AR-1-2: builds executed inline by control verify the candidate spec
      # before persisting (gate-before-persist). Control has a verifier-net
      # route, so this default works on the stock stack.
      VERIFIER_URL: ${VERIFIER_URL:-http://verifier:8000}
      # REQ-029: fail-closed gate. With this set, a build/repair persists a
      # release only after a passing verifier verdict — never on an
      # unreachable verifier or a skipped check.
      AUTOBRIDGE_REQUIRE_VERIFIER_GATE: "1"
      # REQ-027: simulator demo keys by default (.env / explicit env wins).
      # The sims accept these values, so a fresh clone syncs green without
      # exporting keys first. Demo values only — never real credentials.
      ATLAS_API_KEY: ${ATLAS_API_KEY:-sim-demo-key}
      HARBOR_API_KEY: ${HARBOR_API_KEY:-sim-demo-key}
      LEGACYSTAY_API_KEY: ${LEGACYSTAY_API_KEY:-sim-demo-key}
      MERIDIAN_CLIENT_TOKEN: ${MERIDIAN_CLIENT_TOKEN:-meridian-client-token}
      MERIDIAN_ACCESS_TOKEN: ${MERIDIAN_ACCESS_TOKEN:-meridian-access-token}
      # REQ-021 item 5: frontier/small model access for the engine. Only the
      # key names travel in config; values stay in .env / the host env and
      # are never logged, stored or returned by the API.
      FRONTIER_API_KEY: ${FRONTIER_API_KEY:-}
      FRONTIER_BASE_URL: ${FRONTIER_BASE_URL:-}
      FRONTIER_MODEL: ${FRONTIER_MODEL:-}
      SMALL_MODEL: ${SMALL_MODEL:-}
      # REQ-022 B: cloud command queue for the on-premise agent (engine-net
      # DNS; the agent polls it outbound, control enqueues through it).
      EDGE_RELAY_URL: ${EDGE_RELAY_URL:-http://edge-relay:8000}
    networks:
      - engine-net
      - verifier-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8101:8000"
    healthcheck: *healthcheck-py

  worker:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.engine.app:app
      AUTOBRIDGE_RUNTIME: "docker"
      # AR-2-4: repair jobs persisted by the worker sign releases with the
      # same HMAC key control uses; must match edge-worker or edge
      # execution refuses the release.
      EDGE_RELEASE_SECRET: ${EDGE_RELEASE_SECRET:-}
      # REQ-029 (AR-1-2 residual, fail-closed): still no VERIFIER_URL here —
      # the worker is on engine-net only with no verifier-net route. The
      # worker verifies every candidate release through control's
      # POST /internal/verify proxy instead (control sits on verifier-net;
      # same engine-net, same control token). With no reachable verifier at
      # all the gate raises and NO release is persisted — an unverified
      # release can never be stored or activated from any process.
      CONTROL_URL: http://control:8000
      AUTOBRIDGE_CONTROL_TOKEN: ${AUTOBRIDGE_CONTROL_TOKEN:-}
      AUTOBRIDGE_REQUIRE_VERIFIER_GATE: "1"
      # REQ-021 item 5: same frontier/small model env as control (the ladder
      # runs here on worker-executed repairs; values never logged/stored).
      FRONTIER_API_KEY: ${FRONTIER_API_KEY:-}
      FRONTIER_BASE_URL: ${FRONTIER_BASE_URL:-}
      FRONTIER_MODEL: ${FRONTIER_MODEL:-}
      SMALL_MODEL: ${SMALL_MODEL:-}
      # REQ-027: same simulator demo-key defaults as control: sync jobs
      # executed here authenticate the same way.
      ATLAS_API_KEY: ${ATLAS_API_KEY:-sim-demo-key}
      HARBOR_API_KEY: ${HARBOR_API_KEY:-sim-demo-key}
      LEGACYSTAY_API_KEY: ${LEGACYSTAY_API_KEY:-sim-demo-key}
      MERIDIAN_CLIENT_TOKEN: ${MERIDIAN_CLIENT_TOKEN:-meridian-client-token}
      MERIDIAN_ACCESS_TOKEN: ${MERIDIAN_ACCESS_TOKEN:-meridian-access-token}
    networks:
      - engine-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8102:8000"
    healthcheck: *healthcheck-py

  runtime-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.runtime.app:app
      AUTOBRIDGE_RUNTIME: "docker"
    networks:
      - engine-net
      - vendor-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8103:8000"
    healthcheck: *healthcheck-py

  verifier:
    build:
      context: .
      dockerfile: verifier/Dockerfile
    networks:
      - verifier-net
    ports:
      # AR-1-4 residual: the verifier is the root of every acceptance
      # decision, so it never follows AUTOBRIDGE_BIND_HOST — it stays
      # loopback-only even when the rest of the stack is LAN-exposed.
      - "127.0.0.1:8104:8000"
    volumes:
      # Hidden fixtures are mounted read-only here; no other service mounts
      # this volume and worker / runtime-sandbox have no route to this net.
      - ./verifier/hidden_cases:/fixtures:ro
    healthcheck: *healthcheck-py

  edge-worker:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.edge.app:app
      # AR-2-4: HMAC key for the signed command bundle. Must match control
      # (bundle minting) or startup refuses the bundle; empty (local dev)
      # accepts the dev-mode unsigned bundle.
      EDGE_RELEASE_SECRET: ${EDGE_RELEASE_SECRET:-}
      # REQ-022 B: outbound-only agent. Polls the cloud queue, reports back
      # with a client-credentials style token (never logged); no inbound
      # execution port from the cloud.
      EDGE_AGENT_ID: ${EDGE_AGENT_ID:-grand-plaza-pabx}
      EDGE_RELAY_URL: ${EDGE_RELAY_URL:-http://edge-relay:8000}
      EDGE_AGENT_TOKEN: ${EDGE_AGENT_TOKEN:-}
      EDGE_BUNDLE_SIGNATURE: ${EDGE_BUNDLE_SIGNATURE:-}
      EDGE_STORE_PATH: /srv/edge_agent.db
      FIAS_LISTEN_HOST: 0.0.0.0
      FIAS_LISTEN_PORT: 5010
    networks:
      - edge-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8114:8000"
    healthcheck: *healthcheck-py

  # REQ-022 B: dumb authenticated command queue between control and the
  # on-premise agent. The agent polls it (edge-net), control enqueues and
  # drains through it (engine-net); it initiates no connections itself.
  edge-relay:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.edge.relay:app
      AUTOBRIDGE_CONTROL_TOKEN: ${AUTOBRIDGE_CONTROL_TOKEN:-}
      EDGE_AGENT_TOKEN: ${EDGE_AGENT_TOKEN:-}
      EDGE_RELAY_DB: /srv/edge_relay.db
    networks:
      - edge-net
      - engine-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8120:8000"
    healthcheck: *healthcheck-py

  sim-atlas:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.atlaspms.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8105:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8109:8001"
    healthcheck: *healthcheck-py

  sim-harbor:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.harborpms.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8106:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8110:8001"
    healthcheck: *healthcheck-py

  sim-legacystay:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.legacystay.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8111:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8112:8001"
    healthcheck: *healthcheck-py

  sim-meridian:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.meridianpms.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8116:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8117:8001"
    healthcheck: *healthcheck-py

  # REQ-022 FIAS PABX: the on-premise exchange. Edge-net ONLY (reachable by
  # the edge agent, never by control, worker, sandbox or UI). The PABX
  # dials OUT to the integration host (FIAS_HOST:FIAS_PORT); nothing dials
  # in. Public HTTP (docs page) is loopback-published like the other sims;
  # the admin API stays literal loopback (AR-1-4 residual).
  # REQ-034: control reaches the FIAS admin API through the
  # sim-fias-pabx-admin sidecar below (same :8001, admin-net alias), never
  # directly — this container keeps no admin-net route at all.
  sim-fias-pabx:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.fias_pabx.app:app
      ADMIN_EXTRA_ROUTER: simulators.fias_pabx.admin:router
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
      SIM_STATE_FILE: /tmp/sim_fias_state.json
      FIAS_HOST: edge-worker
      FIAS_PORT: 5010
    networks:
      edge-net:
        # Plain service-name alias resolves on edge-net as always; the
        # -edge name gives the sidecar an unambiguous edge-net-only
        # target (its own admin-net alias must never resolve to itself).
        aliases:
          - sim-fias-pabx-edge
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8118:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8119:8001"
    healthcheck: *healthcheck-py

  # REQ-034: admin-port forwarder for the FIAS PABX. The FIAS container
  # cannot join admin-net itself (Docker publishes a dual-homed
  # container's host ports through one endpoint, which would orphan the
  # :8118 docs page or expose the :8000 data plane to control), so this
  # dumb TCP pipe (:8001 -> sim-fias-pabx-edge:8001 over edge-net) carries
  # the sim-fias-pabx DNS alias on admin-net ONLY. Control's
  # POST /demo/reset + /demo/inject-fault proxy therefore reaches
  # sim-fias-pabx:8001 via admin-net while the data plane (:8000, edge-net)
  # stays unreachable from control. No host ports: the host keeps using
  # :8119 straight to the FIAS container. The pipe inspects no bytes;
  # X-Admin-Network / X-Admin-Token are enforced by the FIAS admin app.
  # The target name MUST be edge-net-only: pointing it at the shared
  # alias would make the pipe dial itself (forwarding fork-bomb).
  sim-fias-pabx-admin:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    command: ["python", "-m", "simulators.admin_fwd"]
    environment:
      FORWARD_LISTEN_PORT: 8001
      FORWARD_TARGET_HOST: sim-fias-pabx-edge
      FORWARD_TARGET_PORT: 8001
    networks:
      admin-net:
        aliases:
          - sim-fias-pabx
      edge-net: {}
    healthcheck:
      # Liveness of the pipe itself; end-to-end (control -> FIAS admin) is
      # asserted live by `make smoke` with admin headers.
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s = socket.create_connection(('127.0.0.1', 8001), timeout=3); s.close()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # P2.S4.1 MCP Guardian: mock HotelTools V1/V2 + compatibility gateway
  # (engine trust zone, engine-net only; no verifier/simulator route).
  mcp-hotel:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: mcp_stretch.app:app
      PYTHONPATH: /srv/src:/srv
    networks:
      - engine-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8115:8000"
    healthcheck: *healthcheck-py

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      # REQ-018: rewrites() is evaluated at build time, so the server-only
      # control address is baked from this build arg (never NEXT_PUBLIC_*,
      # never into a browser chunk — only the /api/* rewrite destination).
      args:
        CONTROL_URL: http://control:8000
    environment:
      AUTOBRIDGE_CONTROL_TOKEN: ${AUTOBRIDGE_CONTROL_TOKEN:-}
      # REQ-018: server-only control address for the /api/* rewrite (never baked into the browser bundle).
      CONTROL_URL: http://control:8000
    networks:
      - engine-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8107:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  bench:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: bench.app:app
    networks:
      - engine-net
      - verifier-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8108:8000"
    healthcheck: *healthcheck-py

networks:
  engine-net:
    driver: bridge
  vendor-net:
    driver: bridge
  # Isolation is by attachment (see the service network lists above), NOT by
  # `internal: true`: an internal-only attachment silently drops the host
  # port publishing, so /readyz for a single-network service (verifier)
  # would be unreachable from `make smoke` on the host.
  verifier-net:
    driver: bridge
  admin-net:
    driver: bridge
  edge-net:
    driver: bridge

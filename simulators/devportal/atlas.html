<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtlasPMS API Reference</title>
<link rel="stylesheet" href="/developers/assets/banner.css">
<style>
  :root {
    --ink: #10201f; --ink-2: #4a5c5a; --line: #dfe6e4; --bg: #fbfcfc; --panel: #f2f6f5;
    --brand: #0f6e66; --brand-2: #0b4f49; --code-bg: #0f1c1b; --code-ink: #d6ebe7;
    --get: #0f6e66; --post: #8a4b00;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  a { color: var(--brand); }
  header.top { display: flex; align-items: center; gap: 24px; height: 60px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 2; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; font-size: 17px; }
  .logo svg { width: 26px; height: 26px; }
  header.top nav { display: flex; gap: 20px; font-size: 14px; }
  header.top nav a { color: var(--ink-2); text-decoration: none; }
  header.top nav a.on { color: var(--ink); font-weight: 600; }
  .ver { margin-left: auto; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); }
  aside { position: sticky; top: 60px; height: calc(100vh - 60px); overflow: auto; border-right: 1px solid var(--line); padding: 24px 16px; background: #fff; }
  aside a { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; }
  aside a:hover { background: var(--panel); }
  .nav-h { margin: 18px 8px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 600; }
  .nav-h:first-child { margin-top: 0; }
  main { padding: 40px 48px 120px; max-width: 1180px; }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 8px; }
  .lede { font-size: 17px; color: var(--ink-2); max-width: 680px; margin: 0 0 24px; }
  .facts { display: flex; gap: 32px; margin: 0 0 32px; padding: 16px 20px; background: var(--panel); border-radius: 10px; }
  .facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
  .facts dd { margin: 2px 0 0; font-weight: 600; }
  h2 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 8px; display: flex; align-items: center; gap: 12px; }
  #auth { margin-top: 8px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 24px 0 8px; }
  .op { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 40px; padding: 48px 0; border-top: 1px solid var(--line); }
  .op:first-child { border-top: 0; }
  .path { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 18px; font-weight: 600; }
  .summary { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .m { font: 700 11px/1 ui-monospace, Menlo, monospace; padding: 4px 6px; border-radius: 4px; color: #fff; background: var(--get); letter-spacing: 0.04em; }
  aside .m { font-size: 10px; padding: 3px 5px; }
  .m-post { background: var(--post); }
  table.fields { width: 100%; border-collapse: collapse; font-size: 14px; margin: 4px 0 8px; }
  table.fields th { text-align: left; font-size: 12px; color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 0; }
  table.fields td { border-bottom: 1px solid var(--line); padding: 8px 8px 8px 0; vertical-align: top; }
  table.fields td:first-child { white-space: nowrap; }
  .req { margin-left: 6px; font-size: 11px; color: #a3401b; font-weight: 600; }
  .in, .fmt { font-size: 12px; color: var(--ink-2); }
  .resp { margin: 8px 0 12px; }
  .resp .code { font: 700 12px ui-monospace, Menlo, monospace; padding: 2px 6px; border-radius: 4px; background: #e3f1ee; color: var(--brand-2); }
  .resp .code.c4 { background: #fbe9e3; color: #a3401b; }
  .op-code { position: sticky; top: 84px; align-self: start; }
  .op-code pre { margin: 0 0 16px; padding: 16px; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; overflow: auto; line-height: 1.5; }
  .code-h { margin: 0 0 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .model-sec { padding: 32px 0; border-top: 1px solid var(--line); max-width: 760px; }
  .note { color: var(--ink-2); font-size: 14px; margin: 0 0 8px; }
  a.model { font-weight: 600; }
  #models-h { margin-top: 56px; font-size: 26px; }
</style>
</head>
<body>
<div class="sim-banner">Simulated vendor documentation for the AutoBridge demo · rendered live from <a href="/docs/atlas-openapi.yaml">atlas-openapi.yaml</a></div>
<header class="top">
  <div class="logo">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#0f6e66" stroke-width="2.5"/><path d="M4 16h24M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28" fill="none" stroke="#0f6e66" stroke-width="2"/></svg>
    AtlasPMS <span style="font-weight:400;color:var(--ink-2)">Developers</span>
  </div>
  <nav><a href="#">Guides</a><a class="on" href="#">API reference</a><a href="#">Changelog</a><a href="#">Status</a></nav>
  <span class="ver" id="ver">v—</span>
</header>
<div class="shell">
  <aside id="nav"></aside>
  <main>
    <div id="intro"></div>
    <div id="ops"></div>
  </main>
</div>
<script src="/developers/assets/openapi.js"></script>
<script>
fetch("/developers/source", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then((spec) => {
    const out = VendorOpenAPI.render(spec);
    document.getElementById("nav").innerHTML = '<a href="#auth">Authentication</a>' + out.nav;
    document.getElementById("intro").innerHTML = out.intro;
    const ops = out.main.split('<section class="model-sec"');
    document.getElementById("ops").innerHTML = ops[0] + (ops.length > 1 ? '<h2 id="models-h">Models</h2><section class="model-sec"' + ops.slice(1).join('<section class="model-sec"') : "");
    document.getElementById("ver").textContent = "v" + ((spec.info && spec.info.version) || "");
  })
  .catch((e) => { document.querySelector("main").innerHTML = '<p class="load-error">Could not load the API description: ' + e.message + "</p>"; });
</script>
</body>
</html>

# Demo/simulator target registry (REQ-022 owner check 2026-10-29).
#
# Single source of truth for the control plane's demo targets: canonical
# simulator ids, their accepted aliases, the loopback admin port used from
# the host (local mode and e2e), and any extra admin resets beyond the
# shared ``POST /admin/reset`` slot. The control service loads this file at
# startup (see ``src/autobridge/control/demo_targets.py``); engine source
# names no simulator — the "never seen" vendor proof
# (``tests/e2e/test_s1_legacystay.py::test_no_legacystay_specific_rule_or_engine_code``)
# scans ``src/autobridge/*.py`` and fails on any vendor literal there.
#
# Port numbers here must match the infra that publishes/starts the sims:
# ``compose.yaml`` (``127.0.0.1:<host_admin_port>:8001``) and
# ``scripts/local-up.sh`` (``SIM_ADMIN_PORT=<host_admin_port>``). A unit
# test (``tests/unit/test_autobridge_demo_targets.py``) cross-checks them
# so the registry stays one.
targets:
  - id: sim-atlas
    aliases: [atlas, atlaspms, atlas-pms]
    host_admin_port: 8109
    extra_resets: []
    # Display metadata for the simulators index (REQ-022 E): the single
    # registry — no hand-kept vendor list in a second place. Ports here must
    # also match the public API publish (compose ``127.0.0.1:<public_port>:8000``
    # and ``SIM_PUBLIC_PORT=<public_port>`` in scripts/local-up.sh).
    display_name: AtlasPMS
    api_style: "Cloudbeds-style method REST"
    public_port: 8105
    docs_source: simulators/docs/atlas-openapi.yaml
    suggested_credential_ref: ATLAS_API_KEY
    suggested_target_entities: [Reservation, FolioCharge]
  - id: sim-harbor
    aliases: [harbor, harborpms, harbor-pms]
    host_admin_port: 8110
    extra_resets: []
    display_name: HarborPMS
    api_style: "messy wiki docs over REST"
    public_port: 8106
    docs_source: simulators/docs/harbor.md
    suggested_credential_ref: HARBOR_API_KEY
    suggested_target_entities: [Reservation, FolioCharge]
  - id: sim-legacystay
    aliases: [legacystay, legacy]
    host_admin_port: 8112
    extra_resets: []
    display_name: LegacyStay
    api_style: "offset-paged REST"
    public_port: 8111
    docs_source: simulators/docs/legacystay.md
    suggested_credential_ref: LEGACYSTAY_API_KEY
    suggested_target_entities: [Reservation]
  - id: sim-meridian
    aliases: [meridian, meridianpms, meridian-pms]
    host_admin_port: 8117
    extra_resets: []
    display_name: MeridianPMS
    api_style: "Mews-style POST/JSON"
    public_port: 8116
    docs_source: simulators/docs/meridian-openapi.yaml
    suggested_credential_ref: MERIDIAN_API_KEY
    suggested_target_entities: [Reservation, FolioCharge]
  - id: sim-fias-pabx
    # The FIAS link engine keeps its fault state (faults, P# counter,
    # reseeded rooms) outside the shared scenario slot, so the generic
    # reset is not enough — clear it too.
    aliases: [fias, fiaspms]
    host_admin_port: 8119
    extra_resets:
      - suffix: fias
        path: /admin/fias/reset
    display_name: FIAS PABX
    api_style: "FIAS over TCP"
    public_port: 8118
    docs_source: simulators/docs/fias-pabx.md
    suggested_credential_ref: EDGE_TOKEN
    suggested_target_entities: [FolioCharge]

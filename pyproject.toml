[project]
name = "autobridge"
version = "0.1.0"
description = "AutoBridge generic Connect + Heal engine"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "pyyaml>=6.0",
    "jsonpatch>=1.33",
    "jsonschema>=4.23",
    "jsonpath-ng>=1.7",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.2",
    "anthropic>=0.51",
    "openai>=1.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.15",
    "import-linter>=2.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autobridge"]

[tool.uv.workspace]
members = ["verifier", "simulators"]

[tool.uv.sources]
verifier = { workspace = true }
simulators = { workspace = true }

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".mypy_cache", ".ruff_cache", "ui", "mcp_stretch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "TCH", "TID"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- mypy ---
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["\\.venv", "\\.mypy_cache", "\\.ruff_cache", "ui", "mcp_stretch"]

[[tool.mypy.overrides]]
module = "verifier.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "simulators.*"
ignore_errors = true

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "verifier", "simulators"]

# --- coverage ---
[tool.coverage.run]
source = ["autobridge", "verifier", "simulators"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# --- import-linter ---
[tool.importlinter]
root_packages = ["autobridge", "verifier", "simulators"]

[[tool.importlinter.contracts]]
name = "autobridge must not import verifier or simulators"
type = "forbidden"
source_modules = ["autobridge"]
forbidden_modules = ["verifier", "simulators"]

[dependency-groups]
dev = [
    "pytest-randomly>=5.0.0",
]

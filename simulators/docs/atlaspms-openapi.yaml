openapi: 3.1.0
info:
  title: AtlasPMS API
  version: 1.3.0
  description: >-
    AtlasPMS property management API (method-style). All methods live under
    the versioned prefix /api/v1.3 and return a {"success", "data", "count",
    "total"} envelope. Authentication is an API key in the x-api-key header
    (OAuth2 bearer tokens are accepted as an alternative). List methods use
    pageNumber/pageSize pagination. Money arrives as JSON numbers; date-times
    are zone-less "YYYY-MM-DD HH:MM:SS" in America/New_York (documented
    vendor quirk — never assume UTC for a business date-time).
servers:
- url: http://localhost:8105
  description: Simulator public API (AtlasPMS)
security:
- ApiKey: []
paths:
  /api/v1.3/getHotels:
    get:
      operationId: getHotels
      summary: List properties
      description: Returns the list of properties, with each property's timezone and currency.
      security:
      - ApiKey: []
      - OAuth2: []
      parameters:
      - name: propertyIDs
        in: query
        required: false
        schema:
          type: string
        description: List of property IDs, comma-separated.
      - name: propertyName
        in: query
        required: false
        schema:
          type: string
        description: Property name, or part of it.
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Results page number.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Results page size. Max = 100.
      responses:
        '200':
          description: Paginated property list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHotelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1.3/getReservations:
    get:
      operationId: getReservations
      summary: List reservations
      description: >-
        Returns a list of reservations that match the filter criteria.
        Page-based pagination: pageNumber (default 1) and pageSize (default
        100, max 100). The reservation status vocabulary is not_confirmed,
        confirmed, canceled, checked_in, checked_out, no_show.
      security:
      - ApiKey: []
      - OAuth2: []
      parameters:
      - name: propertyID
        in: query
        required: false
        schema:
          type: string
        description: ID for the property to be queried.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - not_confirmed
          - confirmed
          - canceled
          - checked_in
          - checked_out
          - no_show
        description: Filter by current reservation status.
      - name: resultsFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inferior limit datetime, used to filter reservations, based on booking date.
      - name: resultsTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Superior limit datetime, used to filter reservations, based on booking date.
      - name: modifiedFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inferior limit datetime, used to filter reservations, based on booking modification date.
      - name: modifiedTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Superior limit datetime, used to filter reservations, based on booking modification date.
      - name: checkInFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter to reservations with check-in date starting on this date.
      - name: checkInTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter to reservations with check-in date ending on this date.
      - name: checkOutFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter to reservations with check-out date starting on this date.
      - name: checkOutTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter to reservations with check-out date ending on this date.
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Results page number.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Results page size. Max = 100.
      responses:
        '200':
          description: Paginated reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReservationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1.3/getReservation:
    get:
      operationId: getReservation
      summary: Get one reservation
      description: Returns information on a booking specified by the reservationID parameter.
      security:
      - ApiKey: []
      - OAuth2: []
      parameters:
      - name: propertyID
        in: query
        required: false
        schema:
          type: string
      - name: reservationID
        in: query
        required: true
        schema:
          type: string
        description: Reservation unique identifier.
      responses:
        '200':
          description: One reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReservationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1.3/getGuest:
    get:
      operationId: getGuest
      summary: Get guest
      description: Returns information on the primary guest for a reservationID or guestID.
      security:
      - ApiKey: []
      - OAuth2: []
      parameters:
      - name: propertyID
        in: query
        required: false
        schema:
          type: string
      - name: reservationID
        in: query
        required: false
        schema:
          type: string
        description: Reservation unique identifier. Required if no guestID is provided.
      - name: guestID
        in: query
        required: false
        schema:
          type: string
        description: Guest ID. Required if no reservationID is provided.
      responses:
        '200':
          description: One guest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGuestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1.3/getTransactions:
    get:
      operationId: getTransactions
      summary: List folio transactions
      description: >-
        Returns the folio transactions (charges and payments) for a property,
        optionally filtered by reservation. Page-based pagination: pageNumber
        (default 1) and pageSize (default 100, max 100). Amounts are JSON
        numbers in the transaction currency. businessDate is the property-local
        business date (YYYY-MM-DD); transactionDateTime is the property-local
        date-time (YYYY-MM-DD HH:MM:SS, America/New_York).
      security:
      - ApiKey: []
      - OAuth2: []
      parameters:
      - name: propertyID
        in: query
        required: false
        schema:
          type: string
        description: ID for the property to be queried.
      - name: reservationID
        in: query
        required: false
        schema:
          type: string
        description: Filter to one reservation.
      - name: pageNumber
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Results page number.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
        description: Results page size. Max = 100.
      responses:
        '200':
          description: Paginated transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTransactionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      name: x-api-key
      in: header
      description: Property API key. Alternatively, an OAuth2 bearer token in the Authorization header.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/oauth/authorize
          tokenUrl: https://example.com/oauth/token
          scopes:
            read:reservation: Read reservations
            read:guest: Read guests
            read:hotel: Read properties
            read:payment: Read transactions
  schemas:
    Envelope:
      type: object
      required:
      - success
      - data
      - count
      - total
      properties:
        success:
          type: boolean
          description: Whether the request could be completed.
        count:
          type: integer
          description: Number of results on this page.
        total:
          type: integer
          description: Total number of results.
    Property:
      type: object
      required:
      - propertyID
      - propertyName
      properties:
        propertyID:
          type: string
        propertyName:
          type: string
        propertyTimezone:
          type: string
          description: IANA timezone of the property.
        propertyCurrency:
          type: array
          items:
            type: object
            required:
            - currencyCode
            properties:
              currencyCode:
                type: string
                description: ISO currency code used by the property.
    ReservationItem:
      type: object
      required:
      - propertyID
      - reservationID
      - status
      properties:
        propertyID:
          type: string
        reservationID:
          type: string
        dateCreated:
          type: string
          format: date-time
          description: Booking creation date-time, property-local "YYYY-MM-DD HH:MM:SS".
        dateModified:
          type: string
          format: date-time
          description: Booking modification date-time, property-local "YYYY-MM-DD HH:MM:SS".
        status:
          type: string
          enum:
          - not_confirmed
          - confirmed
          - canceled
          - checked_in
          - checked_out
          - no_show
        guestID:
          type: string
        guestName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        adults:
          type: string
        children:
          type: string
        balance:
          type: number
          description: Balance currently owed, JSON number in the property currency.
        sourceName:
          type: string
          description: Source of reservation.
    GetHotelsResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Property'
    GetReservationsResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/ReservationItem'
    GetReservationResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
        data:
          allOf:
          - $ref: '#/components/schemas/ReservationItem'
          - type: object
            properties:
              total:
                type: number
                description: Total price of the booking, JSON number.
              guestEmail:
                type: string
    GetGuestResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
    TransactionItem:
      type: object
      required:
      - transactionID
      - propertyID
      - amount
      properties:
        transactionID:
          type: string
        propertyID:
          type: string
        reservationID:
          type: string
        amount:
          type: number
          description: Transaction amount as a JSON number in the transaction currency.
        currency:
          type: string
          description: ISO currency code of the amount.
        businessDate:
          type: string
          format: date
          description: Property-local business date of the transaction.
        serviceDate:
          type: string
          format: date
        transactionDateTime:
          type: string
          format: date-time
          description: Property-local date-time "YYYY-MM-DD HH:MM:SS" (America/New_York).
        description:
          type: string
    GetTransactionsResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/TransactionItem'
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: object
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: object

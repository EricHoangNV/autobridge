spec_version: 1
connector:
  id: harborpms
  vendor: HarborPMS
  runtime_target: cloud
source:
  base_url: ${HARBOR_BASE_URL}
  auth:
    type: bearer
    credential_ref: HARBOR_API_KEY
    header_name: null
    username: null
    token_url: null
    scopes: []
  rate_limit:
    max_rps: 5.0
    retry:
      statuses:
      - 429
      - 503
      backoff: exponential
      max_attempts: 5
  timezone_source:
    kind: static
    value: America/New_York
    path: null
operations:
  list_reservations:
    method: GET
    path: /reservations
    params: {}
    pagination:
      strategy: cursor
      cursor_param: cursor
      offset_param: null
      page_param: null
      limit_param: limit
      next_path: $.next_cursor
      items_path: $.data
      stop_when:
      - null_cursor
      - repeated_cursor
    checkpoint:
      field: $.updated_at
      mode: max
  list_folios:
    method: GET
    path: /folios
    params: {}
    pagination:
      strategy: cursor
      cursor_param: cursor
      offset_param: null
      page_param: null
      limit_param: limit
      next_path: $.next_cursor
      items_path: $.data
      stop_when:
      - null_cursor
      - repeated_cursor
    checkpoint:
      field: $.posted_at
      mode: max
entities:
  Reservation:
    from: list_reservations
    key: $.reservation_id
    fields:
      reservation_id:
        path: $.reservation_id
        transform: []
      property_id:
        path: $.property_id
        transform: []
      guest_name:
        path: $.guest_name
        transform: []
      arrival_date:
        path: $.arrival_date
        transform:
        - name: date_local
          args:
            tz: source
      departure_date:
        path: $.departure_date
        transform:
        - name: date_local
          args:
            tz: source
      status:
        path: $.status
        transform:
        - name: enum_map
          args:
            map:
              H1: confirmed
              H2: checked_in
              H3: checked_out
              H4: cancelled
              H5: no_show
            on_unknown: block
      total_amount:
        path: $.total_amount
        transform:
        - name: money
          args:
            scale: 2
      currency:
        path: $.currency
        transform: []
      updated_at:
        path: $.updated_at
        transform: []
    checks:
    - kind: unique_key
      compare_to: null
      before: null
      after: null
    - kind: no_loss
      compare_to: $.total
      before: null
      after: null
    - kind: date_order
      compare_to: null
      before: arrival_date
      after: departure_date
    - kind: money_invariant
      field: total_amount
      compare_to: $.gross_sum
  FolioCharge:
    from: list_folios
    key: $.charge_id
    fields:
      charge_id:
        path: $.charge_id
        transform: []
      reservation_id:
        path: $.reservation_id
        transform: []
      property_id:
        path: $.property_id
        transform: []
      business_date:
        path: $.business_date
        transform:
        - name: business_date
          args:
            tz: source
            cutoff: 4
      amount:
        path: $.amount
        transform:
        - name: money
          args:
            scale: 2
      currency:
        path: $.currency
        transform: []
      description:
        path: $.description
        transform: []
      posted_at:
        path: $.posted_at
        transform: []
    checks:
    - kind: unique_key
      compare_to: null
      before: null
      after: null
    - kind: no_loss
      compare_to: $.total
      before: null
      after: null
    - kind: money_invariant
      field: amount
      compare_to: $.gross_sum
    - kind: business_date_invariant
      field: business_date
      reference_field: posted_at
      cutoff: 4
capabilities:
  read:
  - Reservation
  - FolioCharge
  action: []
health:
  canary:
    every: 60s
    operation: list_reservations
    max_pages: 1
  fingerprint:
    keys: true
    types: true
    pagination_shape: true

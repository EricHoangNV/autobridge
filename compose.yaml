# AutoBridge Compose stack (plan §2.1). P1.W1.2: every service as a stub app
# with GET /healthz + GET /readyz, on the four trust-zone networks.
#
# Networks (plan §2.1 + §5 S2):
#   engine-net   control, worker, runtime-sandbox, edge-worker, ui (+ bench reaches control)
#   vendor-net   runtime-sandbox <-> simulator public API (8000) ONLY
#   verifier-net control <-> verifier ONLY
#   admin-net    control <-> simulator admin API (8001, W2.2) ONLY
#   edge-net     edge-worker <-> sim-edgepos public API (8000) ONLY (P2.S2)
#
# Negative checks enforced by attachment (asserted in `make smoke`):
#   runtime-sandbox has no route to verifier-net / admin-net
#   (sandbox -/-> verifier fixtures, sandbox -/-> simulator admin)
#   ui is on engine-net only (ui -/-> simulators, ui -/-> verifier)
#   worker is on engine-net only (no verifier / simulator-admin route)
#   control has no route to edge-net (control -/-> sim-edgepos, P2.S2)
#   edge-worker has no route to vendor-net / verifier-net / admin-net
#   (edge -/-> cloud sims, edge -/-> verifier, edge -/-> simulator admin)

x-healthcheck-py: &healthcheck-py
  test:
    [
      "CMD-SHELL",
      "python -c \"import urllib.request; raise SystemExit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)\"",
    ]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

services:
  control:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.control.app:app
      AUTOBRIDGE_OPERATOR: ${AUTOBRIDGE_OPERATOR:-operator}
      AUTOBRIDGE_CONTROL_TOKEN: ${AUTOBRIDGE_CONTROL_TOKEN:-}
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
      # AR-2-4: HMAC key for edge release signatures. Control signs releases
      # with it; the edge worker verifies with it. Empty (local dev) means
      # unkeyed integrity checksums — set a random value before exposing the
      # stack beyond localhost.
      EDGE_RELEASE_SECRET: ${EDGE_RELEASE_SECRET:-}
      # AR-1-2: builds executed inline by control verify the candidate spec
      # before persisting (gate-before-persist). Control has a verifier-net
      # route, so this default works on the stock stack.
      VERIFIER_URL: ${VERIFIER_URL:-http://verifier:8000}
    networks:
      - engine-net
      - verifier-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8101:8000"
    healthcheck: *healthcheck-py

  worker:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.engine.app:app
      # AR-2-4: repair jobs persisted by the worker sign releases with the
      # same HMAC key control uses; must match edge-worker or edge
      # execution refuses the release.
      EDGE_RELEASE_SECRET: ${EDGE_RELEASE_SECRET:-}
      # NOTE (AR-1-2): no VERIFIER_URL here on purpose. The worker is on
      # engine-net only with no verifier-net route, so it cannot reach the
      # verifier; verification happens on the control-inline build path
      # above. A worker-executed build persists without a gate check only
      # when control's inline execution did not claim the job first.
    networks:
      - engine-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8102:8000"
    healthcheck: *healthcheck-py

  runtime-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.runtime.app:app
    networks:
      - engine-net
      - vendor-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8103:8000"
    healthcheck: *healthcheck-py

  verifier:
    build:
      context: .
      dockerfile: verifier/Dockerfile
    networks:
      - verifier-net
    ports:
      # AR-1-4 residual: the verifier is the root of every acceptance
      # decision, so it never follows AUTOBRIDGE_BIND_HOST — it stays
      # loopback-only even when the rest of the stack is LAN-exposed.
      - "127.0.0.1:8104:8000"
    volumes:
      # Hidden fixtures are mounted read-only here; no other service mounts
      # this volume and worker / runtime-sandbox have no route to this net.
      - ./verifier/hidden_cases:/fixtures:ro
    healthcheck: *healthcheck-py

  edge-worker:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.edge.app:app
      EDGE_ALLOWLIST: sim-edgepos
      EDGEPOS_API_KEY: dummy-edge-key
      # AR-2-4: HMAC key for release verification. Must match control/worker
      # or every /execute is refused; empty (local dev) accepts the legacy
      # unkeyed integrity checksum.
      EDGE_RELEASE_SECRET: ${EDGE_RELEASE_SECRET:-}
    networks:
      - edge-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8114:8000"
    healthcheck: *healthcheck-py

  sim-edgepos:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.edgepos.app:app
    networks:
      - edge-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8113:8000"
    healthcheck: *healthcheck-py

  sim-atlas:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.atlaspms.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8105:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8109:8001"
    healthcheck: *healthcheck-py

  sim-harbor:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.harborpms.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8106:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8110:8001"
    healthcheck: *healthcheck-py

  sim-legacystay:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.legacystay.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8111:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8112:8001"
    healthcheck: *healthcheck-py

  sim-meridian:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    environment:
      APP_MODULE: simulators.meridianpms.app:app
      SIM_ADMIN_TOKEN: ${SIM_ADMIN_TOKEN:-}
    networks:
      - vendor-net
      - admin-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8116:8000"
      # AR-1-4 residual: simulator admin APIs never follow
      # AUTOBRIDGE_BIND_HOST — loopback-only even on a LAN-exposed stack.
      - "127.0.0.1:8117:8001"
    healthcheck: *healthcheck-py

  # P2.S4.1 MCP Guardian: mock HotelTools V1/V2 + compatibility gateway
  # (engine trust zone, engine-net only; no verifier/simulator route).
  mcp-hotel:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: mcp_stretch.app:app
      PYTHONPATH: /srv/src:/srv
    networks:
      - engine-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8115:8000"
    healthcheck: *healthcheck-py

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      # REQ-018: rewrites() is evaluated at build time, so the server-only
      # control address is baked from this build arg (never NEXT_PUBLIC_*,
      # never into a browser chunk — only the /api/* rewrite destination).
      args:
        CONTROL_URL: http://control:8000
    environment:
      AUTOBRIDGE_CONTROL_TOKEN: ${AUTOBRIDGE_CONTROL_TOKEN:-}
      # REQ-018: server-only control address for the /api/* rewrite (never baked into the browser bundle).
      CONTROL_URL: http://control:8000
    networks:
      - engine-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8107:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  bench:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      APP_MODULE: autobridge.bench.app:app
    networks:
      - engine-net
      - verifier-net
    ports:
      - "${AUTOBRIDGE_BIND_HOST:-127.0.0.1}:8108:8000"
    healthcheck: *healthcheck-py

networks:
  engine-net:
    driver: bridge
  vendor-net:
    driver: bridge
  # Isolation is by attachment (see the service network lists above), NOT by
  # `internal: true`: an internal-only attachment silently drops the host
  # port publishing, so /readyz for a single-network service (verifier)
  # would be unreachable from `make smoke` on the host.
  verifier-net:
    driver: bridge
  admin-net:
    driver: bridge
  edge-net:
    driver: bridge

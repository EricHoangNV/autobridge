spec_version: 1
connector:
  id: atlaspms
  vendor: AtlasPMS
  runtime_target: cloud
source:
  base_url: ${ATLAS_BASE_URL}
  auth:
    type: api_key_header
    credential_ref: ATLAS_API_KEY
    header_name: x-api-key
    username: null
    token_url: null
    scopes: []
  rate_limit:
    max_rps: 5.0
    retry:
      statuses:
      - 429
      - 503
      backoff: exponential
      max_attempts: 5
  timezone_source:
    kind: static
    value: America/New_York
    path: null
operations:
  list_reservations:
    method: GET
    path: /api/v1.3/getReservations
    params: {}
    pagination:
      strategy: page
      cursor_param: null
      offset_param: null
      page_param: pageNumber
      limit_param: pageSize
      next_path: null
      items_path: $.data
      total_path: $.total
      stop_when:
      - empty_page
    checkpoint:
      field: $.dateModified
      mode: max
  list_folios:
    method: GET
    path: /api/v1.3/getTransactions
    params: {}
    pagination:
      strategy: page
      cursor_param: null
      offset_param: null
      page_param: pageNumber
      limit_param: pageSize
      next_path: null
      items_path: $.data
      total_path: $.total
      stop_when:
      - empty_page
    checkpoint:
      field: $.transactionDateTime
      mode: max
entities:
  Reservation:
    from: list_reservations
    key: $.reservationID
    fields:
      reservation_id:
        path: $.reservationID
        transform: []
      property_id:
        path: $.propertyID
        transform: []
      guest_name:
        path: $.guestName
        transform: []
      arrival_date:
        path: $.startDate
        transform:
        - name: date_local
          args:
            tz: source
      departure_date:
        path: $.endDate
        transform:
        - name: date_local
          args:
            tz: source
      status:
        path: $.status
        transform:
        - name: enum_map
          args:
            map:
              confirmed: confirmed
              checked_in: checked_in
              checked_out: checked_out
              canceled: cancelled
              no_show: no_show
            on_unknown: block
      total_amount:
        path: $.balance
        transform:
        - name: money
          args:
            scale: 2
      currency:
        path: $.propertyID
        transform:
        - name: enum_map
          args:
            map:
              prop-001: USD
              prop-002: USD
              prop-003: EUR
              prop-004: JPY
              prop-005: GBP
            on_unknown: block
      updated_at:
        path: $.dateModified
        transform:
        - name: datetime_utc
          args:
            tz: source
    checks:
    - kind: unique_key
      compare_to: null
      before: null
      after: null
    - kind: no_loss
      compare_to: $.total
      before: null
      after: null
    - kind: date_order
      compare_to: null
      before: arrival_date
      after: departure_date
    - kind: money_invariant
      field: total_amount
      compare_to: null
  FolioCharge:
    from: list_folios
    key: $.transactionID
    fields:
      charge_id:
        path: $.transactionID
        transform: []
      reservation_id:
        path: $.reservationID
        transform: []
      property_id:
        path: $.propertyID
        transform: []
      business_date:
        path: $.businessDate
        transform:
        - name: date_local
          args:
            tz: source
      amount:
        path: $.amount
        transform:
        - name: money
          args:
            scale: 2
      currency:
        path: $.currency
        transform: []
      description:
        path: $.description
        transform: []
      posted_at:
        path: $.transactionDateTime
        transform:
        - name: datetime_utc
          args:
            tz: source
    checks:
    - kind: unique_key
      compare_to: null
      before: null
      after: null
    - kind: no_loss
      compare_to: $.total
      before: null
      after: null
    - kind: money_invariant
      field: amount
      compare_to: null
    - kind: business_date_invariant
      field: business_date
      reference_field: posted_at
      cutoff: 4
capabilities:
  read:
  - Reservation
  - FolioCharge
  action: []
health:
  canary:
    every: 60s
    operation: list_reservations
    max_pages: 1
  fingerprint:
    keys: true
    types: true
    pagination_shape: true
